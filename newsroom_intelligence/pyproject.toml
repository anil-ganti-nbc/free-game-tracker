[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newsroom-intelligence"
version = "0.1.0"
description = "Modular newsroom intelligence platform for automated news discovery"
requires-python = ">=3.12"
authors = [
    { name = "Newsroom Intelligence Team" }
]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
]

extra = [
    "playwright>=1.40.0",
    "discord-webhook>=1.3.0",
]

[project.urls]
Repository = "https://github.com/newsroom-intelligence/core"
Documentation = "https://newsroom-intelligence.readthedocs.io"

[project.scripts]
newsroom = "newsroom_intelligence.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom_intelligence"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "ARG001", # unused function argument (false positives in base classes)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v"

[tool.coverage.run]
source = ["src/newsroom_intelligence"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
